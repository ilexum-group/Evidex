# Evidex Go Linting Configuration
# Compatible with golangci-lint v2.7+
version: "2"

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - build

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
    - misspell

  disable-all: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - unused
        - ineffassign
      text: "should use simple strings"
